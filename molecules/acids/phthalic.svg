<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 250" width="330" height="250" fill="none">
  <defs>
    <style>
      .atom { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .atom-sub { font-size: 14px; font-weight: 500; }
      .atom-sup { font-size: 13px; font-weight: bold; fill: #dc2626; }
      .bond { stroke: #0f172a; stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Benzene ring hexagon -->
  <path d="M 124.0 125.0 L 102.0 163.1 L 58.0 163.1 L 36.0 125.0 L 58.0 86.9 L 102.0 86.9 Z" class="bond" fill="none" />
  <!-- Inner double bonds: 0-1, 2-3, 4-5 -->
  <line x1="117.0" y1="125.0" x2="98.5" y2="157.0" class="bond" />
  <line x1="61.5" y1="157.0" x2="43.0" y2="125.0" class="bond" />
  <line x1="61.5" y1="93.0" x2="98.5" y2="93.0" class="bond" />
  
  <!-- COOH #1 (top-right) -->
  <text x="180" y="65" class="atom">C</text>
  <text x="180" y="20" class="atom">O</text>
  <text x="250" y="65" class="atom">OH</text>
  <line x1="102" y1="87" x2="164" y2="70" class="bond" />
  <line x1="175" y1="48" x2="175" y2="33" class="bond" />
  <line x1="185" y1="48" x2="185" y2="33" class="bond" />
  <line x1="196" y1="65" x2="230" y2="65" class="bond" />

  <!-- COOH #2 (bottom-right, ortho 1,2) -->
  <text x="180" y="185" class="atom">C</text>
  <text x="180" y="230" class="atom">O</text>
  <text x="250" y="185" class="atom">OH</text>
  <line x1="102" y1="163" x2="164" y2="180" class="bond" />
  <line x1="175" y1="202" x2="175" y2="217" class="bond" />
  <line x1="185" y1="202" x2="185" y2="217" class="bond" />
  <line x1="196" y1="185" x2="230" y2="185" class="bond" />
</svg>