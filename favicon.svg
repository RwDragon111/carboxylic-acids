<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="24" fill="#059669"/>
  <!-- Carboxyl group stylized C=O and OH -->
  <text x="36" y="58" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" fill="#ffffff" text-anchor="middle">C</text>
  <!-- double bond up to O -->
  <line x1="32" y1="36" x2="32" y2="24" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="36" x2="40" y2="24" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="36" y="20" font-family="system-ui, sans-serif" font-weight="bold" font-size="24" fill="#ffffff" text-anchor="middle">O</text>
  <!-- bond right to OH -->
  <line x1="48" y1="52" x2="62" y2="52" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="78" y="58" font-family="system-ui, sans-serif" font-weight="bold" font-size="22" fill="#ffffff" text-anchor="middle">OH</text>
  <!-- bond left -->
  <line x1="12" y1="52" x2="24" y2="52" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>