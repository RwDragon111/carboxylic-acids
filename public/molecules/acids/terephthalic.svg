<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 180" width="460" height="180" fill="none">
  <defs>
    <style>
      .atom { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .atom-sub { font-size: 14px; font-weight: 500; }
      .atom-sup { font-size: 13px; font-weight: bold; fill: #dc2626; }
      .bond { stroke: #0f172a; stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Benzene ring hexagon -->
  <path d="M 272.0 95.0 L 251.0 131.4 L 209.0 131.4 L 188.0 95.0 L 209.0 58.6 L 251.0 58.6 Z" class="bond" fill="none" />
  <!-- Inner double bonds: 0-1, 2-3, 4-5 -->
  <line x1="265.0" y1="95.0" x2="247.5" y2="125.3" class="bond" />
  <line x1="212.5" y1="125.3" x2="195.0" y2="95.0" class="bond" />
  <line x1="212.5" y1="64.7" x2="247.5" y2="64.7" class="bond" />
  
  <!-- Left COOH (Position 4) -->
  <text x="50" y="95" class="atom">HO</text>
  <text x="120" y="95" class="atom">C</text>
  <text x="120" y="35" class="atom">O</text>

  <line x1="72" y1="95" x2="104" y2="95" class="bond" />
  <line x1="136" y1="95" x2="188" y2="95" class="bond" />
  <line x1="115" y1="78" x2="115" y2="50" class="bond" />
  <line x1="125" y1="78" x2="125" y2="50" class="bond" />

  <!-- Right COOH (Position 1, opposite 1,4) -->
  <text x="340" y="95" class="atom">C</text>
  <text x="340" y="35" class="atom">O</text>
  <text x="410" y="95" class="atom">OH</text>

  <line x1="272" y1="95" x2="324" y2="95" class="bond" />
  <line x1="356" y1="95" x2="390" y2="95" class="bond" />
  <line x1="335" y1="78" x2="335" y2="50" class="bond" />
  <line x1="345" y1="78" x2="345" y2="50" class="bond" />
</svg>