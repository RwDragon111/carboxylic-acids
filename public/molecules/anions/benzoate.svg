<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" fill="none">
  <defs>
    <style>
      .atom { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 600; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .atom-sub { font-size: 14px; font-weight: 500; }
      .atom-sup { font-size: 13px; font-weight: bold; fill: #dc2626; }
      .bond { stroke: #0f172a; stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Benzene ring hexagon -->
  <path d="M 127.0 95.0 L 106.0 131.4 L 64.0 131.4 L 43.0 95.0 L 64.0 58.6 L 106.0 58.6 Z" class="bond" fill="none" />
  <!-- Inner double bonds: 0-1, 2-3, 4-5 -->
  <line x1="120.0" y1="95.0" x2="102.5" y2="125.3" class="bond" />
  <line x1="67.5" y1="125.3" x2="50.0" y2="95.0" class="bond" />
  <line x1="67.5" y1="64.7" x2="102.5" y2="64.7" class="bond" />
  
  <text x="195" y="95" class="atom">C</text>
  <text x="195" y="32" class="atom">O</text>
  <text x="270" y="95" class="atom">O<tspan class="atom-sup" dy="-7">⁻</tspan></text>

  <line x1="127" y1="95" x2="179" y2="95" class="bond" />
  <line x1="190" y1="78" x2="190" y2="48" class="bond" />
  <line x1="200" y1="78" x2="200" y2="48" class="bond" />
  <line x1="211" y1="95" x2="252" y2="95" class="bond" />
</svg>